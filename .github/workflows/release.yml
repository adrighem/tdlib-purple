name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Must match the td submodule commit. Increment TD_MARK to invalidate the TDLib build cache.
  TD_TAG: "a17f87c4cff7b90b278d12b91ba0614383aaee82"
  TD_MARK: "m2"

jobs:
  credential-preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate release credentials
        env:
          APPLICATION_API_ID: ${{ secrets.TDLIB_PURPLE_API_ID }}
          APPLICATION_API_HASH: ${{ secrets.TDLIB_PURPLE_API_HASH }}
        run: |
          if [ -z "${APPLICATION_API_ID}" ] || \
             [ -z "${APPLICATION_API_HASH}" ]; then
            echo "Required Telegram application credential secrets are missing." >&2
            exit 1
          fi
          umask 077
          credential_dir="${RUNNER_TEMP}/tdlib-purple-release-preflight"
          mkdir -p "${credential_dir}"
          printf '%s' "${APPLICATION_API_ID}" > "${credential_dir}/api-id"
          printf '%s' "${APPLICATION_API_HASH}" > "${credential_dir}/api-hash"
          python3 credentials/generate-application-credentials.py \
            --api-id-file "${credential_dir}/api-id" \
            --api-hash-file "${credential_dir}/api-hash" \
            --source-root "${GITHUB_WORKSPACE}" \
            --output "${credential_dir}/provider.c" \
            --state-output "${credential_dir}/provider-state.h"

      - name: Remove preflight credential files
        if: ${{ always() }}
        run: |
          rm -f \
            "${RUNNER_TEMP}/tdlib-purple-release-preflight/api-id" \
            "${RUNNER_TEMP}/tdlib-purple-release-preflight/api-hash" \
            "${RUNNER_TEMP}/tdlib-purple-release-preflight/provider.c" \
            "${RUNNER_TEMP}/tdlib-purple-release-preflight/provider-state.h"
          rmdir "${RUNNER_TEMP}/tdlib-purple-release-preflight" \
            2>/dev/null || true

  release-please:
    needs: credential-preflight
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

  linux-tarball:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Prepare release credentials
        env:
          APPLICATION_API_ID: ${{ secrets.TDLIB_PURPLE_API_ID }}
          APPLICATION_API_HASH: ${{ secrets.TDLIB_PURPLE_API_HASH }}
        run: |
          umask 077
          credential_dir="${RUNNER_TEMP}/tdlib-purple-release-credentials"
          mkdir -p "${credential_dir}"
          printf '%s' "${APPLICATION_API_ID}" > "${credential_dir}/api-id"
          printf '%s' "${APPLICATION_API_HASH}" > "${credential_dir}/api-hash"
          printf 'TDLIB_PURPLE_API_ID_FILE=%s\n' \
            "${credential_dir}/api-id" >> "${GITHUB_ENV}"
          printf 'TDLIB_PURPLE_API_HASH_FILE=%s\n' \
            "${credential_dir}/api-hash" >> "${GITHUB_ENV}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            cmake \
            fakeroot \
            g++ \
            gettext \
            git \
            gperf \
            libgtest-dev \
            libopus-dev \
            libpng-dev \
            libpurple-dev \
            libssl-dev \
            libwebp-dev \
            lzop \
            ninja-build \
            pkg-config \
            xz-utils \
            zlib1g-dev

      - name: Cache TDLib build
        uses: actions/cache@v5
        with:
          path: .ga_cache/linux-x86_64
          key: ${{ runner.os }}-release-td-linux-x86_64-${{ env.TD_TAG }}-${{ env.TD_MARK }}

      - name: Build tarball
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TD_CACHE_DIR: .ga_cache/linux-x86_64
        run: ./.github/scripts/build-release-assets.sh tarball linux-x86_64

      - name: Remove release credential files
        if: ${{ always() }}
        run: |
          rm -f \
            "${RUNNER_TEMP}/tdlib-purple-release-credentials/api-id" \
            "${RUNNER_TEMP}/tdlib-purple-release-credentials/api-hash"
          rmdir "${RUNNER_TEMP}/tdlib-purple-release-credentials" \
            2>/dev/null || true

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  deb-packages:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro_id: debian-stable
            image: debian:stable
          - distro_id: ubuntu-24.04-lts
            image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Prepare release credentials
        env:
          APPLICATION_API_ID: ${{ secrets.TDLIB_PURPLE_API_ID }}
          APPLICATION_API_HASH: ${{ secrets.TDLIB_PURPLE_API_HASH }}
        run: |
          umask 077
          credential_dir="${RUNNER_TEMP}/tdlib-purple-release-credentials"
          mkdir -p "${credential_dir}"
          printf '%s' "${APPLICATION_API_ID}" > "${credential_dir}/api-id"
          printf '%s' "${APPLICATION_API_HASH}" > "${credential_dir}/api-hash"
          printf 'TDLIB_PURPLE_API_ID_FILE=%s\n' \
            "${credential_dir}/api-id" >> "${GITHUB_ENV}"
          printf 'TDLIB_PURPLE_API_HASH_FILE=%s\n' \
            "${credential_dir}/api-hash" >> "${GITHUB_ENV}"

      - name: Cache TDLib build
        uses: actions/cache@v5
        with:
          path: .ga_cache/${{ matrix.distro_id }}
          key: ${{ runner.os }}-release-td-${{ matrix.distro_id }}-${{ env.TD_TAG }}-${{ env.TD_MARK }}

      - name: Build Debian package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          ASSET_DISTRO: ${{ matrix.distro_id }}
          IMAGE: ${{ matrix.image }}
          TD_TAG: ${{ env.TD_TAG }}
          TD_MARK: ${{ env.TD_MARK }}
          TD_CACHE_DIR: .ga_cache/${{ matrix.distro_id }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -v "${RUNNER_TEMP}/tdlib-purple-release-credentials:/run/tdlib-purple-host-credentials:ro" \
            -w /work \
            -e VERSION \
            -e ASSET_DISTRO \
            -e TD_TAG \
            -e TD_MARK \
            -e TD_CACHE_DIR \
            -e DEBIAN_FRONTEND=noninteractive \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                bash \
                ca-certificates \
                cmake \
                dpkg-dev \
                fakeroot \
                g++ \
                gettext \
                git \
                gperf \
                libgtest-dev \
                libopus-dev \
                libpng-dev \
                libpurple-dev \
                libssl-dev \
                libwebp-dev \
                lzop \
                ninja-build \
                pkg-config \
                tar \
                xz-utils \
                zlib1g-dev
              umask 077
              credential_dir="$(mktemp -d)"
              trap '\''rm -rf "${credential_dir}"'\'' EXIT
              install -m 0600 \
                /run/tdlib-purple-host-credentials/api-id \
                "${credential_dir}/api-id"
              install -m 0600 \
                /run/tdlib-purple-host-credentials/api-hash \
                "${credential_dir}/api-hash"
              export TDLIB_PURPLE_API_ID_FILE="${credential_dir}/api-id"
              export TDLIB_PURPLE_API_HASH_FILE="${credential_dir}/api-hash"
              umask 022
              ./.github/scripts/build-release-assets.sh deb "$ASSET_DISTRO"
            '

      - name: Remove release credential files
        if: ${{ always() }}
        run: |
          rm -f \
            "${RUNNER_TEMP}/tdlib-purple-release-credentials/api-id" \
            "${RUNNER_TEMP}/tdlib-purple-release-credentials/api-hash"
          rmdir "${RUNNER_TEMP}/tdlib-purple-release-credentials" \
            2>/dev/null || true

      - name: Verify Debian package runtime dependencies
        env:
          ASSET_DISTRO: ${{ matrix.distro_id }}
          IMAGE: ${{ matrix.image }}
        run: |
          deb="$(find release-assets -maxdepth 1 -name "*_${ASSET_DISTRO}_*.deb" -print -quit)"
          if [ -z "$deb" ]; then
            echo "Could not find generated Debian package for ${ASSET_DISTRO} in release-assets" >&2
            exit 1
          fi

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            "$IMAGE" \
            bash -lc './.github/scripts/check-deb-runtime-dependencies.sh "$1"' bash "$deb"

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  rpm-packages:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro_id: fedora-44
            image: fedora:44
          - distro_id: el9
            image: almalinux:9
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Prepare release credentials
        env:
          APPLICATION_API_ID: ${{ secrets.TDLIB_PURPLE_API_ID }}
          APPLICATION_API_HASH: ${{ secrets.TDLIB_PURPLE_API_HASH }}
        run: |
          umask 077
          credential_dir="${RUNNER_TEMP}/tdlib-purple-release-credentials"
          mkdir -p "${credential_dir}"
          printf '%s' "${APPLICATION_API_ID}" > "${credential_dir}/api-id"
          printf '%s' "${APPLICATION_API_HASH}" > "${credential_dir}/api-hash"
          printf 'TDLIB_PURPLE_API_ID_FILE=%s\n' \
            "${credential_dir}/api-id" >> "${GITHUB_ENV}"
          printf 'TDLIB_PURPLE_API_HASH_FILE=%s\n' \
            "${credential_dir}/api-hash" >> "${GITHUB_ENV}"

      - name: Cache TDLib build
        uses: actions/cache@v5
        with:
          path: .ga_cache/${{ matrix.distro_id }}
          key: ${{ runner.os }}-release-td-${{ matrix.distro_id }}-${{ env.TD_TAG }}-${{ env.TD_MARK }}

      - name: Build RPM package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          ASSET_DISTRO: ${{ matrix.distro_id }}
          IMAGE: ${{ matrix.image }}
          TD_TAG: ${{ env.TD_TAG }}
          TD_MARK: ${{ env.TD_MARK }}
          TD_CACHE_DIR: .ga_cache/${{ matrix.distro_id }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -v "${RUNNER_TEMP}/tdlib-purple-release-credentials:/run/tdlib-purple-host-credentials:ro" \
            -w /work \
            -e VERSION \
            -e ASSET_DISTRO \
            -e TD_TAG \
            -e TD_MARK \
            -e TD_CACHE_DIR \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail
              if [ "$ASSET_DISTRO" = "el9" ]; then
                dnf install -y dnf-plugins-core epel-release
                dnf config-manager --set-enabled crb || true
              fi
              dnf install -y \
                bash \
                ca-certificates \
                cmake \
                gcc-c++ \
                gettext \
                git \
                gperf \
                libpng-devel \
                libpurple-devel \
                libwebp-devel \
                lzop \
                make \
                ninja-build \
                openssl-devel \
                opus-devel \
                pkgconf-pkg-config \
                redhat-rpm-config \
                rpm-build \
                tar \
                xz \
                zlib-devel
              umask 077
              credential_dir="$(mktemp -d)"
              trap '\''rm -rf "${credential_dir}"'\'' EXIT
              install -m 0600 \
                /run/tdlib-purple-host-credentials/api-id \
                "${credential_dir}/api-id"
              install -m 0600 \
                /run/tdlib-purple-host-credentials/api-hash \
                "${credential_dir}/api-hash"
              export TDLIB_PURPLE_API_ID_FILE="${credential_dir}/api-id"
              export TDLIB_PURPLE_API_HASH_FILE="${credential_dir}/api-hash"
              umask 022
              ./.github/scripts/build-release-assets.sh rpm "$ASSET_DISTRO"
            '

      - name: Remove release credential files
        if: ${{ always() }}
        run: |
          rm -f \
            "${RUNNER_TEMP}/tdlib-purple-release-credentials/api-id" \
            "${RUNNER_TEMP}/tdlib-purple-release-credentials/api-hash"
          rmdir "${RUNNER_TEMP}/tdlib-purple-release-credentials" \
            2>/dev/null || true

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs:
      - release-please
      - linux-tarball
      - deb-packages
      - rpm-packages
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.linux-tarball.result == 'success' && needs.deb-packages.result == 'success' && needs.rpm-packages.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "${TAG_NAME}" --draft=false --repo "$GITHUB_REPOSITORY"

  cleanup-failed-release:
    needs:
      - release-please
      - linux-tarball
      - deb-packages
      - rpm-packages
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' && (needs.linux-tarball.result != 'success' || needs.deb-packages.result != 'success' || needs.rpm-packages.result != 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Remove incomplete draft release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release delete "${TAG_NAME}" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
