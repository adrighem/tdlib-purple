name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  # Must match the td submodule commit. Increment TD_MARK to invalidate the TDLib build cache.
  TD_TAG: "a17f87c4cff7b90b278d12b91ba0614383aaee82"
  TD_MARK: "m2"

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master

  linux-tarball:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates \
            cmake \
            fakeroot \
            g++ \
            gettext \
            git \
            gperf \
            libgtest-dev \
            libopus-dev \
            libpng-dev \
            libpurple-dev \
            libqrencode-dev \
            libssl-dev \
            libwebp-dev \
            lzop \
            ninja-build \
            pkg-config \
            xz-utils \
            zlib1g-dev

      - name: Cache TDLib build
        uses: actions/cache@v5
        with:
          path: .ga_cache/linux-x86_64
          key: ${{ runner.os }}-release-td-linux-x86_64-${{ env.TD_TAG }}-${{ env.TD_MARK }}

      - name: Build source archive and tarball
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TD_CACHE_DIR: .ga_cache/linux-x86_64
        run: |
          ./.github/scripts/build-release-assets.sh source
          ./.github/scripts/build-release-assets.sh tarball linux-x86_64

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  deb-packages:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro_id: debian-13
            image: debian:13
          - distro_id: ubuntu-24.04-lts
            image: ubuntu:24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: true

      - name: Cache TDLib build
        uses: actions/cache@v5
        with:
          path: .ga_cache/${{ matrix.distro_id }}
          key: ${{ runner.os }}-release-td-${{ matrix.distro_id }}-${{ env.TD_TAG }}-${{ env.TD_MARK }}

      - name: Build Debian package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          ASSET_DISTRO: ${{ matrix.distro_id }}
          IMAGE: ${{ matrix.image }}
          TD_TAG: ${{ env.TD_TAG }}
          TD_MARK: ${{ env.TD_MARK }}
          TD_CACHE_DIR: .ga_cache/${{ matrix.distro_id }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e VERSION \
            -e ASSET_DISTRO \
            -e TD_TAG \
            -e TD_MARK \
            -e TD_CACHE_DIR \
            -e DEBIAN_FRONTEND=noninteractive \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends \
                bash \
                ca-certificates \
                cmake \
                dpkg-dev \
                fakeroot \
                g++ \
                gettext \
                git \
                gperf \
                libgtest-dev \
                libopus-dev \
                libpng-dev \
                libpurple-dev \
                libqrencode-dev \
                libssl-dev \
                libwebp-dev \
                lzop \
                ninja-build \
                pkg-config \
                tar \
                xz-utils \
                zlib1g-dev
              ./.github/scripts/build-release-assets.sh deb "$ASSET_DISTRO"
            '

      - name: Verify Debian package runtime dependencies
        env:
          ASSET_DISTRO: ${{ matrix.distro_id }}
          IMAGE: ${{ matrix.image }}
        run: |
          deb="$(find release-assets -maxdepth 1 -name "*_${ASSET_DISTRO}_*.deb" -print -quit)"
          if [ -z "$deb" ]; then
            echo "Could not find generated Debian package for ${ASSET_DISTRO} in release-assets" >&2
            exit 1
          fi

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            "$IMAGE" \
            bash -lc './.github/scripts/check-deb-runtime-dependencies.sh "$1"' bash "$deb"

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  rpm-packages:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro_id: fedora-44
            image: fedora:44
          - distro_id: el9
            image: almalinux:9
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          submodules: true

      - name: Cache TDLib build
        uses: actions/cache@v5
        with:
          path: .ga_cache/${{ matrix.distro_id }}
          key: ${{ runner.os }}-release-td-${{ matrix.distro_id }}-${{ env.TD_TAG }}-${{ env.TD_MARK }}

      - name: Build RPM package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          ASSET_DISTRO: ${{ matrix.distro_id }}
          IMAGE: ${{ matrix.image }}
          TD_TAG: ${{ env.TD_TAG }}
          TD_MARK: ${{ env.TD_MARK }}
          TD_CACHE_DIR: .ga_cache/${{ matrix.distro_id }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e VERSION \
            -e ASSET_DISTRO \
            -e TD_TAG \
            -e TD_MARK \
            -e TD_CACHE_DIR \
            "$IMAGE" \
            bash -lc '
              set -euo pipefail
              if [ "$ASSET_DISTRO" = "el9" ]; then
                dnf install -y dnf-plugins-core epel-release
                dnf config-manager --set-enabled crb || true
              fi
              dnf install -y \
                bash \
                ca-certificates \
                cmake \
                gcc-c++ \
                gettext \
                git \
                gperf \
                libpng-devel \
                libpurple-devel \
                libwebp-devel \
                qrencode-devel \
                lzop \
                make \
                ninja-build \
                openssl-devel \
                opus-devel \
                pkgconf-pkg-config \
                redhat-rpm-config \
                rpm-build \
                tar \
                xz \
                zlib-devel
              ./.github/scripts/build-release-assets.sh rpm "$ASSET_DISTRO"
            '

      - name: Upload release asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs:
      - release-please
      - linux-tarball
      - deb-packages
      - rpm-packages
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.linux-tarball.result == 'success' && needs.deb-packages.result == 'success' && needs.rpm-packages.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "${TAG_NAME}" --draft=false --repo "$GITHUB_REPOSITORY"

  publish-apt-repository:
    needs:
      - release-please
      - publish-release
    if: ${{ needs.release-please.outputs.release_created == 'true' && needs.publish-release.result == 'success' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/apt-repository.yml

  cleanup-failed-release:
    needs:
      - release-please
      - linux-tarball
      - deb-packages
      - rpm-packages
    if: ${{ always() && needs.release-please.outputs.release_created == 'true' && (needs.linux-tarball.result != 'success' || needs.deb-packages.result != 'success' || needs.rpm-packages.result != 'success') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Remove incomplete draft release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release delete "${TAG_NAME}" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
