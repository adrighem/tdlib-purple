name: Build and test

on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


permissions:
  actions: read
  contents: read

env:
  # Must match the td submodule commit. Increment TD_MARK to invalidate the TDLib build cache.
  TD_TAG: "a17f87c4cff7b90b278d12b91ba0614383aaee82"
  TD_MARK: "m2"

jobs:
  build_and_test_linux:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - { CMAKE_FLAGS: "-DNoVoip=1", INSTALL_LOTTIE: "n", RUN_TESTS: "y", USE_CUSTOM_CREDENTIALS: "y" }
          - { CMAKE_FLAGS: "-DNoVoip=1 -DNoWebp=1", INSTALL_LOTTIE: "n", RUN_TESTS: "n", USE_CUSTOM_CREDENTIALS: "n" }
          - { CMAKE_FLAGS: "-DNoVoip=1 -DNoTranslations=1", INSTALL_LOTTIE: "n", RUN_TESTS: "y", USE_CUSTOM_CREDENTIALS: "n" }
          - { CMAKE_FLAGS: "-DNoVoip=1 -DNoLottie=1", INSTALL_LOTTIE: "n", RUN_TESTS: "n", USE_CUSTOM_CREDENTIALS: "n" }
          - { CMAKE_FLAGS: "-DNoVoip=1 -DNoBundledFmt=1 -DNoBundledLottie=1", INSTALL_FMT: "y", INSTALL_LOTTIE: "y", RUN_TESTS: "n", USE_CUSTOM_CREDENTIALS: "n" }
          - { CMAKE_FLAGS: "-DNoVoip=1 -DNoWebp=1 -DNoTranslations=1 -DNoBundledFmt=1 -DNoBundledLottie=1", INSTALL_FMT: "y", INSTALL_LOTTIE: "y", RUN_TESTS: "n", USE_CUSTOM_CREDENTIALS: "n" }

    steps:
      - uses: actions/checkout@v7

      - name: Verify TDLib pin
        run: |
          submodule_commit="$(git ls-tree HEAD td | awk '{print $3}')"
          if [ "${submodule_commit}" != "${TD_TAG}" ]; then
            echo "TD_TAG=${TD_TAG}"
            echo "td submodule=${submodule_commit}"
            echo "TDLib workflow pin must match the td submodule commit."
            exit 1
          fi

      - name: Check application credential provider
        run: sh ./.github/scripts/check-no-embedded-telegram-credentials.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gettext \
            gperf \
            libgtest-dev \
            libopus-dev \
            libpng-dev \
            libpurple-dev \
            libwebp-dev \
            libwebrtc-audio-processing-dev \
            lzop \
            ninja-build

      - name: Install system rlottie
        if: matrix.INSTALL_LOTTIE == 'y'
        run: sudo apt-get install -y librlottie-dev

      - name: Install system fmt
        if: matrix.INSTALL_FMT == 'y'
        run: sudo apt-get install -y libfmt-dev

      - name: Check tool versions
        run: |
          c++ --version
          cmake --version
          ninja --version
          gettext --version

      - name: Lint translations
        env:
          LINTACCEL_IGNORE_MISSING: y
        run: ./po/lint_accelerators.py

      - name: Cache TDLib build
        uses: actions/cache@v5
        with:
          path: .ga_cache/td_destdir_${{ env.TD_TAG }}_${{ env.TD_MARK }}.tar*
          key: ${{ runner.os }}-td-${{ env.TD_TAG }}-${{ env.TD_MARK }}

      - name: Restore or create TDLib build
        run: ./.github/ga_build_td.sh "${TD_TAG}" "${TD_MARK}"

      - name: Prepare synthetic custom application credentials
        if: matrix.USE_CUSTOM_CREDENTIALS == 'y'
        run: |
          env -i PATH="${PATH}" RUNNER_TEMP="${RUNNER_TEMP}" sh -eu <<'EOF'
          credential_dir="${RUNNER_TEMP}/tdlib-purple-custom-credentials"
          umask 077
          mkdir -m 700 "${credential_dir}"
          printf '%s\n' '123456789' > "${credential_dir}/api-id"
          printf '%s\n' '0123456789abcdef0123456789abcdef' \
            > "${credential_dir}/api-hash"
          chmod 600 "${credential_dir}/api-id" "${credential_dir}/api-hash"
          EOF

      - name: Configure
        run: |
          credential_flags=()
          if [ "${{ matrix.USE_CUSTOM_CREDENTIALS }}" = "y" ]; then
            credential_dir="${RUNNER_TEMP}/tdlib-purple-custom-credentials"
            credential_flags=(
              -DTDLIB_PURPLE_REQUIRE_CUSTOM_CREDENTIALS=ON
              -DTDLIB_PURPLE_API_ID_FILE="${credential_dir}/api-id"
              -DTDLIB_PURPLE_API_HASH_FILE="${credential_dir}/api-hash"
            )
          fi
          env -i PATH="${PATH}" HOME="${HOME}" LANG=C LC_ALL=C \
            cmake -S . -B build -GNinja \
            -DCMAKE_CXX_FLAGS="-DGLIB_DISABLE_DEPRECATION_WARNINGS -Werror -Wall -Wextra -Wformat=2 -Wformat-signedness -Wno-unused-parameter -Wno-parentheses" \
            -DTd_DIR=td_destdir/usr/local/lib/cmake/Td \
            "${credential_flags[@]}" \
            ${{ matrix.CMAKE_FLAGS }}

      - name: Build plugin
        run: |
          env -i PATH="${PATH}" HOME="${HOME}" LANG=C LC_ALL=C \
            cmake --build build --target telegram-tdlib

      - name: Build tests
        if: matrix.RUN_TESTS == 'y'
        run: |
          env -i PATH="${PATH}" HOME="${HOME}" LANG=C LC_ALL=C \
            cmake --build build --target tests

      - name: Run tests
        if: matrix.RUN_TESTS == 'y'
        run: |
          env -i PATH="${PATH}" HOME="${HOME}" LANG=C LC_ALL=C \
            cmake --build build --target run-tests

      - name: Test installation
        run: |
          env -i PATH="${PATH}" HOME="${HOME}" LANG=C LC_ALL=C \
            DESTDIR=tdprpl_destdir cmake --build build --target install

      - name: Remove synthetic custom application credentials
        if: always() && matrix.USE_CUSTOM_CREDENTIALS == 'y'
        run: |
          env -i PATH="${PATH}" RUNNER_TEMP="${RUNNER_TEMP}" sh -eu <<'EOF'
          credential_dir="${RUNNER_TEMP}/tdlib-purple-custom-credentials"
          rm -f "${credential_dir}/api-id" "${credential_dir}/api-hash"
          rmdir "${credential_dir}"
          EOF

  build_and_test_purple3:
    runs-on: ubuntu-24.04
    container:
      image: >-
        docker.io/pidgin/builders@sha256:23b80f85838f999b385046fe606393cf7cb4279eb0adb53d0717535812f022a1

    env:
      PIDGIN_REVISION: "a412f2ead95d60249ca0397b8dfb466b853fad36"
      PIDGIN_ARCHIVE_SHA256: >-
        c52e3edda874d7c05a927bd2c9c8a5502f6606dca3eb933e80549a63b04d4a43

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Verify TDLib pin
        run: |
          env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/github/home USER=root LANG=C LC_ALL=C \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            TD_TAG="${TD_TAG}" \
            sh -eu <<'EOF'
          submodule_commit="$(
            git -c safe.directory="${GITHUB_WORKSPACE}" \
              -C "${GITHUB_WORKSPACE}" ls-tree HEAD td |
              awk '{print $3}'
          )"
          if [ "${submodule_commit}" != "${TD_TAG}" ]; then
            echo "TDLib workflow pin does not match the td submodule." >&2
            exit 1
          fi
          EOF

      - name: Install TDLib build dependencies
        run: |
          env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/github/home USER=root LANG=C LC_ALL=C \
            sh -eu <<'EOF'
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            --no-install-recommends \
            gperf \
            libssl-dev \
            lzop \
            zlib1g-dev
          EOF

      - name: Identify TDLib build ABI
        id: tdlib_abi
        run: |
          env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/github/home USER=root LANG=C LC_ALL=C \
            GITHUB_OUTPUT="${GITHUB_OUTPUT}" \
            sh -eu <<'EOF'
          abi_details="$(
            uname -m &&
            c++ --version &&
            cmake --version &&
            gperf --version &&
            ldd --version &&
            pkg-config --modversion openssl &&
            pkg-config --modversion zlib
          )"
          fingerprint_line="$(printf '%s\n' "${abi_details}" | sha256sum)"
          fingerprint="${fingerprint_line%% *}"
          printf 'fingerprint=%s\n' "${fingerprint}" >> "${GITHUB_OUTPUT}"
          EOF

      - name: Cache Purple 3 TDLib build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: .ga_cache/purple3/td_destdir_${{ env.TD_TAG }}_${{ env.TD_MARK }}.tar*
          key: ${{ runner.os }}-${{ runner.arch }}-purple3-td-${{ env.TD_TAG }}-${{ env.TD_MARK }}-${{ steps.tdlib_abi.outputs.fingerprint }}-${{ hashFiles('.github/ga_build_td.sh') }}

      - name: Restore or create Purple 3 TDLib build
        run: |
          env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/github/home USER=root LANG=C LC_ALL=C \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            TD_TAG="${TD_TAG}" TD_MARK="${TD_MARK}" \
            sh -eu <<'EOF'
          cd "${GITHUB_WORKSPACE}"
          TD_CACHE_DIR=.ga_cache/purple3 \
            ./.github/ga_build_td.sh "${TD_TAG}" "${TD_MARK}"
          test -r td_destdir/usr/local/lib/cmake/Td/TdConfig.cmake
          test -r td_destdir/usr/local/lib/cmake/Td/TdStaticTargets.cmake
          test -r td_destdir/usr/local/lib/libtdclient.a
          EOF

      - name: Fetch pinned Pidgin source
        run: |
          env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/github/home USER=root LANG=C LC_ALL=C \
            PIDGIN_REVISION="${PIDGIN_REVISION}" \
            PIDGIN_ARCHIVE_SHA256="${PIDGIN_ARCHIVE_SHA256}" \
            sh -eu <<'EOF'
          mkdir -p /tmp/pidgin-source
          archive_url=https://keep.imfreedom.org/pidgin/pidgin/archive
          wget -q "${archive_url}/${PIDGIN_REVISION}.tar.gz" \
            -O /tmp/pidgin.tar.gz
          printf '%s  %s\n' \
            "${PIDGIN_ARCHIVE_SHA256}" /tmp/pidgin.tar.gz |
            sha256sum --check --status
          tar -xzf /tmp/pidgin.tar.gz \
            --strip-components=1 \
            -C /tmp/pidgin-source
          EOF

      - name: Apply pinned Pidgin QR rendering fix
        run: |
          env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/github/home USER=root LANG=C LC_ALL=C \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            sh -eu <<'EOF'
          patch -d /tmp/pidgin-source -p1 \
            < "${GITHUB_WORKSPACE}/purple3/patches/pidgin-a412f2-qrcode-rendering.patch"
          EOF

      - name: Build pinned Purple 3
        run: |
          env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/github/home USER=root LANG=C LC_ALL=C \
            sh -eu <<'EOF'
          meson setup /tmp/pidgin-build /tmp/pidgin-source \
            --buildtype=debug \
            -Dauto_features=disabled \
            -Dgtkui=false \
            -Dintrospection=false \
            -Ddoc=false \
            -Dgplugin:doc=false \
            -Dgplugin:help2man=false \
            -Dgplugin:introspection=false \
            -Dgplugin:install-gplugin-query=false \
            -Dgplugin:install-gplugin-gtk4-viewer=false \
            -Dgplugin:lua=false \
            -Dgplugin:python3=false \
            -Dgplugin:vapi=false \
            -Dbirb:doc=false \
            -Dbirb:introspection=false \
            -Dhasl:doc=false \
            -Dhasl:introspection=false \
            -Dseagull:doc=false \
            -Dseagull:introspection=false
          meson compile -C /tmp/pidgin-build purple3
          EOF

      - name: Build and test Purple 3 adapter
        run: |
          env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/github/home USER=root LANG=C LC_ALL=C \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            sh -eu <<'EOF'
          credential_dir="$(mktemp -d /tmp/tdlib-purple3-credentials.XXXXXX)"
          chmod 700 "${credential_dir}"
          trap 'rm -f "${credential_dir}/api-id" \
            "${credential_dir}/api-hash"; rmdir "${credential_dir}"' EXIT
          umask 077
          printf '%s\n' '123456789' > "${credential_dir}/api-id"
          printf '%s\n' '0123456789abcdef0123456789abcdef' \
            > "${credential_dir}/api-hash"
          chmod 600 "${credential_dir}/api-id" "${credential_dir}/api-hash"
          meson devenv -C /tmp/pidgin-build \
            --workdir "${GITHUB_WORKSPACE}" \
            cmake -S purple3 -B /tmp/tdlib-purple3-debug -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DTDLIB_PURPLE_REQUIRE_CUSTOM_CREDENTIALS=ON \
              -DTDLIB_PURPLE_API_ID_FILE="${credential_dir}/api-id" \
              -DTDLIB_PURPLE_API_HASH_FILE="${credential_dir}/api-hash" \
              -DTd_DIR="${GITHUB_WORKSPACE}/td_destdir/usr/local/lib/cmake/Td"
          meson devenv -C /tmp/pidgin-build \
            --workdir "${GITHUB_WORKSPACE}" \
            cmake --build /tmp/tdlib-purple3-debug
          meson devenv -C /tmp/pidgin-build \
            --workdir "${GITHUB_WORKSPACE}" \
            ctest --test-dir /tmp/tdlib-purple3-debug \
              --output-on-failure \
              --no-tests=error
          EOF

      - name: Test Purple 3 adapter without GLib assertions
        run: |
          env -i \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            HOME=/github/home USER=root LANG=C LC_ALL=C \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE}" \
            sh -eu <<'EOF'
          meson devenv -C /tmp/pidgin-build \
            --workdir "${GITHUB_WORKSPACE}" \
            cmake -S purple3 -B /tmp/tdlib-purple3-release -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_FLAGS=-DG_DISABLE_ASSERT \
              -DTd_DIR="${GITHUB_WORKSPACE}/td_destdir/usr/local/lib/cmake/Td"
          meson devenv -C /tmp/pidgin-build \
            --workdir "${GITHUB_WORKSPACE}" \
            cmake --build /tmp/tdlib-purple3-release
          meson devenv -C /tmp/pidgin-build \
            --workdir "${GITHUB_WORKSPACE}" \
            ctest --test-dir /tmp/tdlib-purple3-release \
              --output-on-failure \
              --no-tests=error
          EOF
